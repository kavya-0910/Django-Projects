{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f2f2f2;
        }

        .container {
            width: 900px;
            margin: 40px auto;
            background: white;
            border: 3px solid black;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #d62828;
            margin-bottom: 20px;
        }

        nav {
            border-top: 1px solid #aaa;
            padding-top: 8px;
            margin-bottom: 20px;
        }

        nav a {
            text-decoration: none;
            color: royalblue;
            font-size: 22px;
            font-weight: bold;
            margin: 0 18px;
        }

        nav a:hover {
            color: red;
        }

        .contact-box {
            width: 570px;
            margin: 0 auto;
            border: 2px solid black;
            padding: 30px;
            text-align: left;
        }

        .contact-box h2 {
            text-align: center;
            color: green;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .contact-item {
            font-size: 22px;
            font-weight: bold;
            margin: 25px 0;
        }

        .contact-item span {
            font-weight: normal;
            margin-left: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>EMPLOYEE MANAGEMENT SYSTEM</h1>

        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'register' %}">Register</a>
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'contact' %}">Contact</a>
        </nav>

        <div class="contact-box">

            <h2>Contact Us</h2>

            <div class="contact-item">
                Email:
                <span>example@example.com</span>
            </div>

            <div class="contact-item">
                Phone:
                <span>123-789-9800</span>
            </div>

        </div>

    </div>

</body>
</html>
